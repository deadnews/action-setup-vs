name: Release tagger

on:
  push:
    tags: [v*.*.*]

permissions:
  contents: write

jobs:
  release-tagger:
    name: Push tags
    if: true && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Re-tag the major and minor version using the latest tag
      - name: Tag major and minor versions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          MAJOR_VERSION="${GITHUB_REF_NAME%%.*}"
          MINOR_VERSION="${GITHUB_REF_NAME%.*}"

          git tag -a "${MAJOR_VERSION}" -m "chore(release): autoupdate for ${GITHUB_REF_NAME}" -f
          git push origin "${MAJOR_VERSION}" -f

          git tag -a "${MINOR_VERSION}" -m "chore(release): autoupdate for ${GITHUB_REF_NAME}" -f
          git push origin "${MINOR_VERSION}" -f
